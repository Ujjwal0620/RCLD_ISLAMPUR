name: ERP CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/student-profile-decomposition, feature/student-icard-directory]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npx eslint "app/dashboard/students/[id]/page.js" "app/dashboard/students/icards/page.js" "app/api/students/route.js" "app/api/batches/[id]/notes/route.js" "app/api/students/import" components/students/profile components/students/UniversalWorkbookImport.js features/students/hooks features/students/print models/ImportLog.js models/StudentImportStaging.js models/StudentImportPaymentClaim.js tests/student-import/universal-import-helpers.test.mjs lib/student-import
      - name: Run student import unit tests
        run: node --test tests/student-import/*.test.mjs
      - name: Build Next.js application
        run: npm run build
